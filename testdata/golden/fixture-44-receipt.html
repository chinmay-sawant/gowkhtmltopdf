<!DOCTYPE html>
<!--
  fixture-44-receipt
  Proves: a compact point-of-sale receipt with item rows, tax, payment, and
  a clear total suitable for transactional PDF generation.
  Expected: 1 page.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Receipt RC-2025-0044 - Acme Market</title>
  <style>
    body { font-family: sans-serif; font-size: 10pt; margin: 0; color: #222; }
    .receipt { width: 420px; margin: 0 auto; border: 1px solid #777; padding: 18px; }
    h1 { font-size: 17pt; text-align: center; margin: 0 0 4px; }
    .muted { color: #666; text-align: center; margin: 3px 0 14px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 5px 3px; border-bottom: 1px solid #ddd; }
    th { text-align: left; font-size: 9pt; color: #555; }
    .num { text-align: right; }
    .total td { border-top: 2px solid #222; border-bottom: 0; font-size: 13pt; font-weight: bold; padding-top: 10px; }
    .paid { margin: 14px 0 0; text-align: center; color: #176b3a; font-weight: bold; }
  </style>
</head>
<body>
  <section class="receipt">
    <h1>Acme Market</h1>
    <p class="muted">Receipt RC-2025-0044 · 2025-02-14 · Card ending 2044</p>
    <table>
      <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Amount</th></tr></thead>
      <tbody>
        <tr><td>Notebook, recycled paper</td><td class="num">2</td><td class="num">12.00 EUR</td></tr>
        <tr><td>Desk lamp, warm white</td><td class="num">1</td><td class="num">28.50 EUR</td></tr>
        <tr><td>USB-C cable, 2 metres</td><td class="num">1</td><td class="num">9.90 EUR</td></tr>
        <tr><td>Reusable coffee cup</td><td class="num">1</td><td class="num">16.00 EUR</td></tr>
      </tbody>
      <tfoot>
        <tr><td colspan="2">Subtotal</td><td class="num">66.40 EUR</td></tr>
        <tr><td colspan="2">VAT 19%</td><td class="num">12.62 EUR</td></tr>
        <tr class="total"><td colspan="2">Paid total</td><td class="num">79.02 EUR</td></tr>
      </tfoot>
    </table>
    <p class="paid">PAID · Thank you for your purchase</p>
  </section>
</body>
</html>
