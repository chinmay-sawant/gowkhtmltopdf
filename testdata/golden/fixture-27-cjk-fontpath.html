<!DOCTYPE html>
<!--
  fixture-27-cjk-fontpath
  Proves: CJK (Chinese/Japanese) and Hangul render when Unicode faces are
  available via --font-path. Samples pass Droid + testdata/fonts (Hangul
  subset) when present. Expected: 1 page.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>CJK Sample</title>
  <style>
    body {
      font-family: "Droid Sans Fallback", "Noto Sans KR", "Noto Sans CJK SC", sans-serif;
      font-size: 14pt;
    }
    h1 { font-size: 18pt; }
    .ko { font-family: "Noto Sans KR", "Droid Sans Fallback", sans-serif; }
  </style>
</head>
<body>
  <h1>国际化报告</h1>
  <p>こんにちは、世界。Hello mixed Latin + 中文 + 日本語.</p>
  <p>汉字与假名：東京都、上海、深圳。</p>
  <p class="ko">안녕하세요. 한글 테스트.</p>
</body>
</html>
