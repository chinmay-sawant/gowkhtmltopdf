<!DOCTYPE html>
<!--
  fixture-26-position-lite
  Proves: position:relative offsets and position:absolute overlays
  (phase 17 position lite). Expected: 1 page.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Position Lite</title>
  <style>
    body { font-family: sans-serif; font-size: 10pt; margin: 16pt; }
    .rel {
      position: relative;
      top: 6pt;
      left: 12pt;
      background: #eef6ee;
      padding: 8pt;
      border: 1px solid #2e7d32;
    }
    .box {
      position: relative;
      height: 60pt;
      border: 1px dashed #666;
      margin-top: 16pt;
    }
    .abs {
      position: absolute;
      top: 8pt;
      left: 24pt;
      width: 120pt;
      background: #fff3e0;
      border: 1px solid #ef6c00;
      padding: 4pt;
    }
  </style>
</head>
<body>
  <h1>Position lite</h1>
  <div class="rel">Relatively offset block</div>
  <div class="box">
    <div class="abs">Absolute overlay</div>
    In-flow text under the overlay container.
  </div>
</body>
</html>
