<!DOCTYPE html>
<!--
  fixture-28-flex-wrap-grid-fixed
  Proves: flex-wrap, display:grid lite, position:fixed stamp (phase deferred).
  Expected: ≥2 pages so fixed badge appears on each page.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Flex wrap / grid / fixed</title>
  <style>
    body { font-family: sans-serif; font-size: 10pt; margin: 12pt; }
    .badge {
      position: fixed; top: 4pt; right: 8pt; width: 70pt;
      background: #333; color: #fff; padding: 3pt; font-size: 8pt;
    }
    .wrap {
      display: flex; flex-wrap: wrap; gap: 6pt; width: 220pt;
      border: 1px solid #999; padding: 4pt; margin-bottom: 12pt;
    }
    .wrap > div { width: 70pt; background: #e3f2fd; padding: 4pt; }
    .grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6pt;
      border: 1px solid #666; padding: 4pt;
    }
    .grid > div { background: #f3e5f5; padding: 4pt; }
    .spacer { page-break-before: always; }
  </style>
</head>
<body>
  <div class="badge">FIXED</div>
  <h1>Wrap + grid</h1>
  <div class="wrap">
    <div>A1</div><div>A2</div><div>A3</div><div>A4</div>
  </div>
  <div class="grid">
    <div>G1</div><div>G2</div><div>G3</div><div>G4</div>
  </div>
  <div class="spacer"></div>
  <p>Page two body — fixed badge should still paint.</p>
</body>
</html>
