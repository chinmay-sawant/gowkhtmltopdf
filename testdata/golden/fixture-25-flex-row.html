<!DOCTYPE html>
<!--
  fixture-25-flex-row
  Proves: display:flex row with justify-content, gap, and flex-grow
  (phase 17 partial flex). Expected: 1 page.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Flex Row Lite</title>
  <style>
    body { font-family: sans-serif; font-size: 10pt; margin: 12pt; }
    .row {
      display: flex;
      flex-direction: row;
      justify-content: space-between;
      gap: 8pt;
      border: 1px solid #333;
      padding: 6pt;
    }
    .grow {
      flex-grow: 1;
      background: #e8f0fe;
      padding: 4pt;
    }
    .fixed {
      width: 80pt;
      background: #fce8e6;
      padding: 4pt;
    }
  </style>
</head>
<body>
  <h1>Flex row lite</h1>
  <div class="row">
    <div class="fixed">Left</div>
    <div class="grow">Growing middle column</div>
    <div class="fixed">Right</div>
  </div>
</body>
</html>
