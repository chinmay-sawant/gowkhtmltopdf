<!DOCTYPE html>
<!--
  fixture-53-asteria-observatory-poster
  Proves: a second poster variant can share the print theme while changing
  the art direction, palette emphasis, title scale, and supporting copy.
  Expected: 1 page with at least one embedded image.
-->
<html>
<head>
  <meta charset="utf-8">
  <title>Asteria Sky Archive poster</title>
  <link rel="stylesheet" href="theme-print-stories.css">
</head>
<body>
  <div class="print-page poster poster-sky">
    <div class="poster-art">
      <img src="assets/asteria-observatory-poster-print.png" alt="A mapmaker looking across a floating observatory city">
    </div>
    <div class="poster-copy">
      <div class="small-caps">Field notes from above the weather</div>
      <h1>Asteria Sky Archive</h1>
      <p>A study of floating gardens, remembered routes, and the first lantern to find a path through the clouds.</p>
      <div class="poster-meta">
        <span>Archive 03</span>
        <span>Open sky series</span>
        <span>2026</span>
      </div>
    </div>
  </div>
</body>
</html>
