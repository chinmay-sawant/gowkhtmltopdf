name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Test
        run: make test
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: make lint

  build:
    name: static build (CGO_ENABLED=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Build gowkhtmltopdf
        run: CGO_ENABLED=0 go build ./cmd/gowkhtmltopdf
      - name: Build gowkhtmltoimage
        run: CGO_ENABLED=0 go build ./cmd/gowkhtmltoimage
