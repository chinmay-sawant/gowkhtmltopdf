name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Test
        run: make test
      - name: Claim scan
        run: make claim-scan
      - name: Install golangci-lint
        # Build with the job's Go (1.26+): v1.64 refuses to lint when the binary
        # was compiled with an older Go than go.mod targets.
        run: GOTOOLCHAIN=local go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Lint
        run: make lint

  build:
    name: static build (CGO_ENABLED=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Build gowkhtmltopdf
        run: CGO_ENABLED=0 go build -ldflags "-X gowkhtmltopdf/internal/cli.Version=$(cat VERSION)" ./cmd/gowkhtmltopdf
      - name: Build gowkhtmltoimage
        run: CGO_ENABLED=0 go build -ldflags "-X gowkhtmltopdf/internal/cli.Version=$(cat VERSION)" ./cmd/gowkhtmltoimage
      - name: Version stamp
        run: test "$(./gowkhtmltopdf --version | awk '/Version:/{print $$2}')" = "$(cat VERSION)"

  race:
    name: race (hot packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Race
        run: go test -race -count=1 ./internal/convert ./internal/layout ./internal/pdf ./internal/imageout ./internal/load

  frontend:
    name: frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build docs site
        working-directory: frontend
        run: npm ci && npm run build
      - name: Fail if generated docs are dirty
        run: |
          if [ -n "$(git status --porcelain -- docs frontend/dist)" ]; then
            echo "generated docs/dist are dirty" >&2
            git status --porcelain -- docs frontend/dist
            exit 1
          fi
