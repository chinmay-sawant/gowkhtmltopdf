name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: test + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Test
        run: make test
      - name: Claim scan
        run: make claim-scan
      - name: Install golangci-lint
        # Build with the job's Go (1.26+): v1.64 refuses to lint when the binary
        # was compiled with an older Go than go.mod targets.
        run: GOTOOLCHAIN=local go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8
      - name: Install frontend deps
        run: npm ci --prefix frontend
      - name: Lint
        run: make lint

  build:
    name: static build (CGO_ENABLED=0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Build gowkhtmltopdf
        run: |
          ver=$(tr -d '[:space:]' < VERSION)
          CGO_ENABLED=0 go build -ldflags "-X gowkhtmltopdf/internal/cli.Version=${ver}" \
            -o gowkhtmltopdf ./cmd/gowkhtmltopdf
      - name: Build gowkhtmltoimage
        run: |
          ver=$(tr -d '[:space:]' < VERSION)
          CGO_ENABLED=0 go build -ldflags "-X gowkhtmltopdf/internal/cli.Version=${ver}" \
            -o gowkhtmltoimage ./cmd/gowkhtmltoimage
      - name: Version stamp
        # Avoid awk $N / $$ escaping pitfalls in Actions; compare the Version:
        # banner line to the trimmed VERSION file.
        run: |
          set -euo pipefail
          want=$(tr -d '[:space:]' < VERSION)
          got=$(./gowkhtmltopdf --version | sed -n 's/^Version:[[:space:]]*//p' | tr -d '[:space:]')
          echo "VERSION file: ${want}"
          echo "binary:       ${got}"
          test -n "${got}"
          test "${got}" = "${want}"
      - name: Purity guard (cgo only allowed in bindings/c)
        # Phase 40.4 drift guard: under CGO_ENABLED=0 no package may carry
        # CgoFiles except the opt-in bindings/c facade.
        run: |
          set -euo pipefail
          offenders=$(CGO_ENABLED=0 go list -json ./... \
            | jq -r 'select(.CgoFiles and (.CgoFiles|length>0)) | .ImportPath')
          status=0
          while IFS= read -r pkg; do
            [ -z "${pkg}" ] && continue
            case "${pkg}" in
              github.com/chinmay-sawant/gowkhtmltopdf/bindings/c) ;;
              *)
                echo "purity guard: cgo files outside bindings/c: ${pkg}" >&2
                status=1
                ;;
            esac
          done <<< "${offenders}"
          if [ "${status}" -eq 0 ]; then
            echo "purity guard ok: cgo confined to bindings/c"
          fi
          exit "${status}"

  race:
    name: race (hot packages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Race
        # Caps match make test / make test-race: -race roughly doubles RSS and
        # uncapped parallel fixtures thrash ~7 GiB runners.
        run: make test-race

  frontend:
    name: frontend production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build docs site
        working-directory: frontend
        run: npm ci && npm run build
      - name: Fail if generated docs are dirty
        run: |
          if [ -n "$(git status --porcelain -- docs frontend/dist)" ]; then
            echo "generated docs/dist are dirty" >&2
            git status --porcelain -- docs frontend/dist
            exit 1
          fi

  # --- Phases 40.5 / 44.4: opt-in cgo CI. These jobs never feed back into
  # the pure-Go default targets above; CGO_ENABLED=1 is set per step only.
  build-shared:
    name: c-shared build (CGO_ENABLED=1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - name: Build c-shared library
        env:
          CGO_ENABLED: "1"
        run: make c-shared
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify ABI and version stamp via ctypes
        # Loads dist/libgowkhtmltopdf.so out-of-process from Python and pins
        # the frozen contract: gowkhtmltopdf_abi_version() == 1 and
        # gowkhtmltopdf_version() == trimmed VERSION file contents.
        run: |
          python3 - <<'PY'
          import ctypes
          import pathlib

          lib = ctypes.CDLL("dist/libgowkhtmltopdf.so")
          lib.gowkhtmltopdf_abi_version.argtypes = []
          lib.gowkhtmltopdf_abi_version.restype = ctypes.c_int32
          lib.gowkhtmltopdf_version.argtypes = []
          lib.gowkhtmltopdf_version.restype = ctypes.c_char_p

          abi = lib.gowkhtmltopdf_abi_version()
          got = lib.gowkhtmltopdf_version().decode("utf-8")
          want = pathlib.Path("VERSION").read_text().strip()

          assert abi == 1, f"abi_version() = {abi}, want 1"
          assert got == want, f"version() = {got!r}, want {want!r}"
          print(f"c-shared ok: abi={abi} version={got}")
          PY

  python-binding:
    name: python binding suite
    needs: build-shared
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build c-shared library
        env:
          CGO_ENABLED: "1"
        run: make c-shared
      - name: Install python binding (editable)
        run: pip install -e ./bindings/python
      - name: Run unittest suite
        run: python3 -m unittest discover -s bindings/python/tests -t . -v
