<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Alignment under vertical writing modes</title>
  <style>
    html, body { margin: 0; padding: 0; }
    .case {
      display: flex;
      writing-mode: vertical-rl;
      flex-flow: row wrap;
      width: 180pt;
      height: 100pt;
      align-items: flex-end;
      position: relative;
      transform: translateY(56pt);
    }
    .item { flex: none; width: 20pt; height: 20pt; }
  </style>
</head>
<body>
  <!-- Source: third_party/blink/web_tests/css3/flexbox/flex-align-vertical-writing-mode.html -->
  <!-- Port status: completed. Writing-mode axis remapping follows the flex consumer's logical axes. -->
  <!-- Expected: row flow follows the vertical inline axis and flex-end reaches the physical left edge. -->
  <div class="case" id="case-8" aria-label="vertical writing alignment">
    <div class="item">A</div>
    <div class="item">B</div>
    <div class="item">C</div>
  </div>
  <p class="case-description" style="position:absolute;top:12pt;left:12pt;margin:0;padding:6pt;border:1pt solid #64748b;background:#fff;color:#111827;font-size:9pt;line-height:12pt;width:560pt;">
    <strong>Case 8 expected behavior:</strong> vertical writing remaps row flow to the vertical inline axis, and flex-end places the items at the physical left cross edge.
  </p>
</body>
