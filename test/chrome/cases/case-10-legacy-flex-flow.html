<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Flow, direction, padding, and constraints</title>
  <style>
    html, body { margin: 0; padding: 0; }
    .case {
      display: flex;
      width: 600pt;
      height: 20pt;
      direction: rtl;
      flex-flow: row-reverse;
      position: relative;
      transform: translateY(56pt);
    }
    .item { flex: none; height: 20pt; width: 20pt; border: 0; }
    .item-a { flex: 1 0 0; margin: 0 auto; }
    .item-b { flex: 2 0 0; padding-inline-start: 200pt; }
    .item-c { flex: 1 0 0; margin-inline-end: 100pt; }
  </style>
</head>
<body>
  <!-- Source: third_party/blink/web_tests/css3/flexbox/flex-flow.html -->
  <!-- Port status: completed. RTL reverse placement and constrained sizing match Chromium. -->
  <!-- Expected: RTL row-reverse keeps A at 0pt, B at 75pt, and C at 525pt; B is 350pt wide. -->
  <div class="case" id="case-10" aria-label="RTL row reverse with logical padding and margins">
    <div class="item item-a">A</div>
    <div class="item item-b">B</div>
    <div class="item item-c">C</div>
  </div>
  <p class="case-description" style="position:absolute;top:12pt;left:12pt;margin:0;padding:6pt;border:1pt solid #64748b;background:#fff;color:#111827;font-size:9pt;line-height:12pt;width:560pt;">
    <strong>Case 10 expected behavior:</strong> RTL row-reverse preserves logical padding and margins: A starts at 0pt, B starts at 75pt with width 350pt, and C starts at 525pt.
  </p>
</body>
</html>
