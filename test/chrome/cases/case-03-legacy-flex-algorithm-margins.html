<!doctype html>
<html>
<head>

  <title>Flex sizing with fixed and auto margins</title>
  <style>
    html, body { margin: 0; padding: 0; }

  <!-- Port status: completed. Reviewed static input with passing expected geometry. -->
  <!-- Expected: auto margins consume positive free space; negative space uses scaled shrink; padding moves the content box. -->
  <div class="case" id="positive-auto-margins">
    <div class="item positive" id="positive-first"></div>
    <div class="item positive positive-auto" id="positive-auto"></div>
    <div class="item positive" id="positive-last"></div>
  </div>
  <div class="case" id="negative-auto-margins">
    <div class="item negative-first" id="negative-first"></div>
    <div class="item negative-auto" id="negative-auto"></div>

  </p>
