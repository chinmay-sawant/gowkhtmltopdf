<!doctype html>

  <title>Definite main size and percentage children</title>
  <style>
    html, body { margin: 0; padding: 0; }

    .flex-one { flex: 1 1 0; min-height: 0; background: #dbeafe; outline: 1px solid #2563eb; }
    .percentage-child { width: 100%; height: 50%; background: #dcfce7; outline: 1px solid #16a34a; }
    .fixed { flex: 0 0 auto; width: 50pt; height: 50pt; background: #fef3c7; outline: 1px solid #d97706; }
    .pdf-label { position: absolute; top: 360pt; left: 12pt; color: #111827; font-size: 10pt; }
  </style>
</head>
<body>
  <!-- Source: third_party/blink/web_tests/css3/flexbox/definite-main-size.html -->
  <!-- Port status: blocked. Percentage descendants do not yet receive the flex item's definite used height. -->
  <!-- Expected: 50% of the 250pt flexible item resolves to 125pt. -->
  <div class="case" id="definite-column">
    <div class="flex-one" id="flexible-column-item">
      <div class="percentage-child" id="percentage-child"></div>
    </div>
    <div class="fixed" id="fixed-column-item"></div>
  </div>
  <div class="pdf-label">Definite column size and percentage child</div>
